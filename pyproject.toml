[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "antigravity-chrome-bridge"
version = "2.0.24"
description = "Persistent Python REPL Runtime and Native Messaging Bridge for Google Chrome"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
antigravity-chrome-bridge = "setup_host:main"
chrome-bridge = "setup_host:main"
chrome-bridge-mcp = "mcp_server:main"
chrome-bridge-native-host = "native_host:main"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
